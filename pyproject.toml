[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-primitives-mcp"
version = "1.11.0"
description = "Vision-primitive MCP server for text-only LLMs: describe, locate (coordinates), OCR, annotate, crop, zoom, anomaly scan, UI parse, computer use"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["Pillow"]

[project.optional-dependencies]
numpy = ["numpy"]
yolo = ["ultralytics"]

[tool.setuptools]
py-modules = ["vision_primitives_mcp"]
